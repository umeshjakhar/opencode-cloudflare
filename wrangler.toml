name = "opencode-server"
main = "src/index.ts"
compatibility_date = "2025-01-14"

[[containers]]
class_name = "OpenCodeContainer"
image = "./Dockerfile"
max_instances = 1  # Single shared instance
instance_type = "standard-2"  # 1 vCPU, 6GB RAM

[[durable_objects.bindings]]
name = "OPENCODE_CONTAINER"
class_name = "OpenCodeContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OpenCodeContainer"]

# Keep-warm scheduler. When enabled in the admin dashboard, this pings the
# container every 10 minutes so it never sleeps. Disabled -> no pings, so the
# container sleeps after the configured idle timeout.
[triggers]
crons = ["*/10 * * * *"]

[vars]
# R2 persistent storage (non-secret config; credentials go in secrets)
R2_ACCOUNT_ID = "c462a7bcb7dd0bf5eeedb2144b2ac25a"
R2_BUCKET_NAME = "opencode-persistent"

# R2 bucket binding so the worker/admin API can read & write the persisted
# opencode.json directly (same bucket the container mounts via FUSE)
[[r2_buckets]]
binding = "OPENCODE_CONFIG_R2"
bucket_name = "opencode-persistent"

# Secrets (set via wrangler secret put):
# - OPENCODE_SERVER_PASSWORD (required for OpenCode server auth)
# - OPENCODE_API_KEY (OpenCode Zen API key - get from https://opencode.ai/auth)
# - ADMIN_PASSWORD (optional, for admin UI - defaults to OPENCODE_SERVER_PASSWORD)
# - GIT_TOKEN (optional, for private git operations)
# - R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (required for persistent storage - get from R2 dashboard)
